<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Dark mode variant — same geometry, gold #a07b3b strokes -->

  <!-- ═══ Layer 1 — ultra-fine 7.5px sub-grid ═══ -->
  <g stroke="#a07b3b" stroke-width="0.28" fill="none">
    <line x1="7.5"  y1="0"    x2="60"   y2="52.5"/>
    <line x1="22.5" y1="0"    x2="60"   y2="37.5"/>
    <line x1="37.5" y1="0"    x2="60"   y2="22.5"/>
    <line x1="52.5" y1="0"    x2="60"   y2="7.5"/>
    <line x1="0"    y1="7.5"  x2="52.5" y2="60"/>
    <line x1="0"    y1="22.5" x2="37.5" y2="60"/>
    <line x1="0"    y1="37.5" x2="22.5" y2="60"/>
    <line x1="0"    y1="52.5" x2="7.5"  y2="60"/>
    <line x1="7.5"  y1="0"    x2="0"    y2="7.5"/>
    <line x1="22.5" y1="0"    x2="0"    y2="22.5"/>
    <line x1="37.5" y1="0"    x2="0"    y2="37.5"/>
    <line x1="52.5" y1="0"    x2="0"    y2="52.5"/>
    <line x1="60"   y1="7.5"  x2="7.5"  y2="60"/>
    <line x1="60"   y1="22.5" x2="22.5" y2="60"/>
    <line x1="60"   y1="37.5" x2="37.5" y2="60"/>
    <line x1="60"   y1="52.5" x2="52.5" y2="60"/>
  </g>

  <!-- ═══ Layer 2 — medium 15px grid ═══ -->
  <g stroke="#a07b3b" stroke-width="0.55" fill="none">
    <line x1="15" y1="0"  x2="60" y2="45"/>
    <line x1="45" y1="0"  x2="60" y2="15"/>
    <line x1="0"  y1="15" x2="45" y2="60"/>
    <line x1="0"  y1="45" x2="15" y2="60"/>
    <line x1="15" y1="0"  x2="0"  y2="15"/>
    <line x1="45" y1="0"  x2="0"  y2="45"/>
    <line x1="60" y1="15" x2="15" y2="60"/>
    <line x1="60" y1="45" x2="45" y2="60"/>
  </g>

  <!-- ═══ Layer 3 — bold 30px structural grid ═══ -->
  <g stroke="#a07b3b" stroke-width="1.05" fill="none">
    <line x1="0"  y1="0"  x2="60" y2="60"/>
    <line x1="30" y1="0"  x2="60" y2="30"/>
    <line x1="0"  y1="30" x2="30" y2="60"/>
    <line x1="30" y1="0"  x2="0"  y2="30"/>
    <line x1="60" y1="0"  x2="0"  y2="60"/>
    <line x1="60" y1="30" x2="30" y2="60"/>
  </g>

  <!-- ═══ Ornament nodes ═══ -->
  <g fill="#a07b3b">
    <circle cx="15" cy="15" r="1.3"/>
    <circle cx="45" cy="15" r="1.3"/>
    <circle cx="30" cy="30" r="1.6"/>
    <circle cx="15" cy="45" r="1.3"/>
    <circle cx="45" cy="45" r="1.3"/>
    <circle cx="30" cy="0"  r="1.3"/>
    <circle cx="0"  cy="30" r="1.3"/>
    <circle cx="60" cy="30" r="1.3"/>
    <circle cx="30" cy="60" r="1.3"/>
  </g>
</svg>

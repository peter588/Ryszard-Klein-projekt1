<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root, [data-theme="light"] {
    --ink: #1C1914; --ink-light: #6B6356;
    --gold: #A07B3A; --gold-light: #C9A868;
    --mist: #D4CDBF;
    --nav-bg: rgba(247,243,236,0.9);
    --toggle-bg: #3D3830; --toggle-color: #F7F3EC;
    --theme-transition: background 0.4s ease, color 0.4s ease;
  }
  [data-theme="dark"] {
    --ink: #F0EAE0; --ink-light: #9A8E7E;
    --gold: #C9A868; --gold-light: #A07B3A;
    --mist: #3A332A;
    --nav-bg: rgba(22,18,16,0.93);
    --toggle-bg: #C9A868; --toggle-color: #161210;
    --theme-transition: background 0.4s ease, color 0.4s ease;
  }

  html { scroll-behavior: smooth; }
  body {
    background: #1a1713;
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
  }

  /* ── NAV (fixed) ── */
  nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    padding: 1rem 2.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--nav-bg); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(212,205,191,0.3);
    transition: var(--theme-transition);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink); text-decoration: none; transition: color 0.3s;
  }
  .nav-logo:hover { color: var(--gold); }
  .nav-right { display: flex; align-items: center; gap: 1.25rem; }
  .nav-back {
    font-family: 'Jost', sans-serif; font-size: 0.65rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-light); text-decoration: none; transition: color 0.3s;
  }
  .nav-back:hover { color: var(--gold); }
  .theme-toggle {
    width: 34px; height: 34px; background: var(--toggle-bg);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.3s; flex-shrink: 0;
  }
  .theme-toggle:hover { opacity: 0.8; }
  .theme-toggle svg {
    width: 15px; height: 15px; stroke: var(--toggle-color);
    fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-moon { display: block; }
  .icon-sun  { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun  { display: block; }

  /* ── GALLERY WRAPPER ── */
  .gallery-wrap { padding-top: 62px; }

  /* ── BENTO GRID ── */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: clamp(240px, 27vw, 380px);
    gap: 3px;
  }

  .gallery-cell {
    overflow: hidden; position: relative; display: block;
    min-height: 0;
  }

  .gallery-cell img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
    transition: transform 0.65s ease;
  }
  .gallery-cell:hover img { transform: scale(1.04); }

  /* ── SCROLL INDICATOR ── */
  .scroll-indicator {
    position: fixed;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .scroll-indicator span {
    font-size: 0.52rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(247,243,236,0.45);
  }
  .scroll-indicator svg {
    width: 22px; height: 22px;
    stroke: rgba(247,243,236,0.35); fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    animation: chevronBounce 2s ease-in-out infinite;
  }
  @keyframes chevronBounce {
    0%, 100% { transform: translateY(0);   opacity: 0.6; }
    50%       { transform: translateY(6px); opacity: 1;   }
  }
  .scroll-indicator.hidden { opacity: 0; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    nav { padding: 0.9rem 1.5rem; }
    .gallery-wrap { padding-top: 56px; }
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: clamp(190px, 33vw, 290px);
    }
  }
  @media (max-width: 520px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: clamp(150px, 40vw, 230px);
    }
  }
</style>
</head>

<div class="scroll-indicator" id="scrollIndicator" aria-hidden="true">
  <span>scroll</span>
  <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
</div>

<script>
  const html = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('rk-theme', next);
  });

  const indicator = document.getElementById('scrollIndicator');
  window.addEventListener('scroll', () => {
    indicator.classList.toggle('hidden', window.scrollY > 80);
  }, { passive: true });
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root, [data-theme="light"] {
    --ink: #1C1914; --ink-light: #6B6356;
    --gold: #A07B3A; --gold-light: #C9A868;
    --mist: #D4CDBF; --nav-bg: rgba(247,243,236,0.9);
    --toggle-bg: #3D3830; --toggle-color: #F7F3EC;
    --page-bg: #1a1713;
  }
  [data-theme="dark"] {
    --ink: #F0EAE0; --ink-light: #9A8E7E;
    --gold: #C9A868; --gold-light: #A07B3A;
    --mist: #3A332A; --nav-bg: rgba(22,18,16,0.93);
    --toggle-bg: #C9A868; --toggle-color: #161210;
    --page-bg: #1a1713;
  }
  html, body { height: 100%; scroll-behavior: smooth; }
  body { background: var(--page-bg); font-family: 'Jost', sans-serif; overflow: hidden; }
  nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    padding: 1rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; background: var(--nav-bg); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(212,205,191,0.3);
  }
  .nav-logo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
  .nav-right { display: flex; align-items: center; gap: 1.25rem; }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; }
  .nav-links a {
    font-family: 'Jost', sans-serif;
    font-size: 0.67rem; font-weight: 400;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-light); text-decoration: none;
    transition: color 0.3s; white-space: nowrap;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-hamburger {
    display: none; background: none; border: none;
    cursor: pointer; flex-direction: column; gap: 5px;
  }
  .nav-hamburger span {
    display: block; width: 24px; height: 1.5px;
    background: var(--ink); transition: all 0.3s;
  }
  .theme-toggle { width: 34px; height: 34px; background: var(--toggle-bg); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s; }
  .theme-toggle:hover { opacity: 0.8; }
  .theme-toggle svg { width: 15px; height: 15px; stroke: var(--toggle-color); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icon-moon { display: block; }
  .icon-sun  { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun  { display: block; }
  main { position: absolute; top: 62px; bottom: 0; left: 0; right: 0; overflow: auto; }
  .gallery-wrap { padding: 0; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: clamp(240px, 27vw, 380px);
    gap: 3px;
  }
  .gallery-cell {
    overflow: hidden;
    position: relative;
    display: block;
    min-height: 0;
    cursor: pointer;
  }
  .gallery-cell.wide { grid-column: span 2; }
  .gallery-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform 0.65s ease;
    user-select: none;
  }
  .gallery-cell:hover img { transform: scale(1.04); }
  @media(max-width: 900px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .gallery-cell.wide { grid-column: span 2; }
    .nav-links { display: none !important; }
    .nav-links.is-open {
      display: flex !important;
      flex-direction: column; position: absolute;
      top: 62px; left: 0; right: 0;
      background: var(--nav-bg);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--mist);
      gap: 1.25rem; z-index: 99;
    }
    .nav-hamburger { display: flex !important; }
  }
  @media(max-width: 520px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }

<script>
  const html = document.documentElement;
  const toggleBtn = document.getElementById('themeToggle');
  if (toggleBtn) toggleBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('rk-theme', next);
  });

  // ── LIGHTBOX GALLERY ──
  const galleryImages = Array.from(document.querySelectorAll('.gallery-grid img'));
  let currentIndex = 0;

  const lightbox = document.createElement('div');
  lightbox.style.cssText = 'position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(8,8,8,0.95);backdrop-filter:blur(10px);';
  lightbox.innerHTML = `
    <button style="position:absolute;top:1.25rem;right:1.25rem;border:none;background:rgba(255,255,255,0.1);color:#f7f3ec;width:48px;height:48px;border-radius:50%;cursor:pointer;" aria-label="Zamknij">
      <svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
    <button style="position:absolute;left:1.25rem;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,0.1);color:#f7f3ec;width:48px;height:48px;border-radius:50%;cursor:pointer;" aria-label="Poprzednie">
      <svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24"><polyline points="15 6 8 12 15 18"/></svg>
    </button>
    <img src="" alt="Galeria" style="max-width:100%;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:0.35rem;box-shadow:0 20px 75px rgba(0,0,0,0.42);" />
    <button style="position:absolute;right:1.25rem;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,0.1);color:#f7f3ec;width:48px;height:48px;border-radius:50%;cursor:pointer;" aria-label="Następne">
      <svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24"><polyline points="9 6 16 12 9 18"/></svg>
    </button>
  `;
  document.body.appendChild(lightbox);

  const lightboxImg = lightbox.querySelector('img');
  const buttons = lightbox.querySelectorAll('button');
  const [closeBtn, prevBtn, nextBtn] = buttons;

  const openLightbox = (index) => {
    currentIndex = (index + galleryImages.length) % galleryImages.length;
    lightboxImg.src = galleryImages[currentIndex].src;
    lightbox.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  };

  const closeLightbox = () => {
    lightbox.style.display = 'none';
    document.body.style.overflow = '';
  };

  galleryImages.forEach((img, i) => {
    img.addEventListener('click', () => openLightbox(i));
  });

  closeBtn.addEventListener('click', closeLightbox);
  prevBtn.addEventListener('click', () => openLightbox(currentIndex - 1));
  nextBtn.addEventListener('click', () => openLightbox(currentIndex + 1));
  lightbox.addEventListener('click', (e) => e.target === lightbox && closeLightbox());
  window.addEventListener('keydown', (e) => {
    if (lightbox.style.display !== 'flex') return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') openLightbox(currentIndex - 1);
    if (e.key === 'ArrowRight') openLightbox(currentIndex + 1);
  });

  // HAMBURGER
  const hamburger = document.querySelector('.nav-hamburger');
  const navLinks = document.querySelector('.nav-links');
  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('is-open');
  });
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    navLinks.classList.remove('is-open');
  }));
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900) navLinks.classList.remove('is-open');
  });
</script>
